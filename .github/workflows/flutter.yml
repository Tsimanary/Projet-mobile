name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualite:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Doit rester >= au plancher de `pubspec.yaml`
          # (sdk >= 3.4.3 => Flutter 3.24 minimum). La 3.22 faisait échouer
          # `flutter pub get`, donc analyse et tests ne tournaient jamais.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test --reporter expanded
